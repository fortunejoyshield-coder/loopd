<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Channel — Goals & Progress</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      margin: 0;
      padding: 20px;
    }
    .section {
      max-width: 800px;
      margin: auto;
    }
    h2, h3 {
      margin-bottom: 10px;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    ul li::before {
      content: "• ";
      color: #ff0044;
    }
    .progress-container {
      width: 100%;
      background: #333;
      border-radius: 10px;
      margin: 20px 0;
      overflow: hidden;
    }
    .progress-bar {
      height: 25px;
      background: #ff0044;
      width: 0%;
      transition: width 0.5s;
    }
    #sub-info {
      margin-top: 10px;
      font-size: 14px;
      opacity: 0.8;
    }
    a {
      color: #ffcc00;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="section">
  <h2>About My Channel</h2>

  <h3>Subscriber Goals</h3>
  <ul id="goal-list"></ul>

  <div class="progress-container">
    <div class="progress-bar" id="progress-bar"></div>
  </div>

  <p id="sub-info">Loading subscriber count...</p>

  <p>
    I make videos that try to keep you watching.<br>
    New uploads every day to every month — join the squad.
  </p>

  <p>
    Check out my channel here:
    <a href="https://www.youtube.com/@mynameisjoyinsanskrit?sub_confirmation=1" target="_blank">
      Visit My YouTube Channel
    </a>
  </p>
</div>

<script>
  // Subscriber milestone goals
  const goals = [
    50, 80, 100, 200, 400, 800, 1000,
    2000, 4000, 8000, 9000, 10000,
    20000, 30000, 40000, 50000,
    70000, 90000, 100000
  ];

  // Show goals in list
  const goalList = document.getElementById("goal-list");
  goals.forEach(g => {
    const li = document.createElement("li");
    li.textContent = g + " subs";
    goalList.appendChild(li);
  });

  // Fetch subs from third-party API (no API key)
  async function fetchSubs() {
    const CHANNEL_ID = "UC7qHCN-73rDlEHPO6cpy8Tw"; // your real channel ID
    const url = `https://api.socialcounts.org/youtube-live-subscriber-count?channelid=${CHANNEL_ID}`;

    try {
      const response = await fetch(url);
      const data = await response.json();

      const subs = data.subscriberCount;
      document.getElementById("sub-info").textContent =
        "Current Subscribers: " + subs;

      updateProgress(subs);
    } catch (error) {
      document.getElementById("sub-info").textContent =
        "Error loading subscriber count.";
      console.error(error);
    }
  }

  // Update progress bar toward next goal
  function updateProgress(subs) {
    const nextGoal = goals.find(g => g > subs) || goals[goals.length - 1];
    const progressPercent = Math.min((subs / nextGoal) * 100, 100);

    document.getElementById("progress-bar").style.width =
      progressPercent + "%";

    document.getElementById("sub-info").textContent +=
      ` | Next goal: ${nextGoal} subs (${progressPercent.toFixed(1)}% there)`;
  }

  fetchSubs();
</script>

</body>
</html>
