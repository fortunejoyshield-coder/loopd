<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My channels </title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
      text-align: center;
    }

    #progress-container {
      width: 80%;
      height: 30px;
      background: #ddd;
      margin: 20px auto;
      border-radius: 10px;
      overflow: hidden;
    }

    #progress-bar {
      height: 100%;
      width: 0%;
      background: #4caf50;
      transition: width 0.5s ease;
    }

    #goal-list {
      list-style: none;
      padding: 0;
      margin-top: 20px;
    }

    #goal-list li {
      padding: 5px;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <h1>My channels/h1>
  <p id="sub-info">Loading subscriber count...</p>

  <div id="progress-container">
    <div id="progress-bar"></div>
  </div>

  <h2>Milestones</h2>
  <ul id="goal-list"></ul>

  <script>
    const goals = [
      50, 80, 100, 200, 400, 800, 1000,
      2000, 4000, 8000, 9000, 10000,
      20000, 30000, 40000, 50000,
      70000, 90000, 100000
    ];

    const CHANNEL_ID = "UC7qHCN-73rDlEHPO6cpy8Tw";

    // WEEKLY BACKUP VALUE — UPDATE THIS NUMBER EVERY WEEK
    const WEEKLY_BACKUP = 42;

    const API_SOURCES = [
      `https://api.socialcounts.org/youtube-live-subscriber-count?channelid=${CHANNEL_ID}`,
      `https://mixerno.space/api/youtube-live-subscriber-count/${CHANNEL_ID}`,
      `https://api.pepeizq.dev/youtube/${CHANNEL_ID}`
    ];

    const goalList = document.getElementById("goal-list");
    goals.forEach(g => {
      const li = document.createElement("li");
      li.textContent = g + " subs";
      goalList.appendChild(li);
    });

    async function fetchSubsHybrid() {
      let subs = null;

      for (const url of API_SOURCES) {
        try {
          const response = await fetch(url + "&t=" + Date.now(), {
            cache: "no-store"
          });
          const data = await response.json();

          if (data.subscriberCount) subs = data.subscriberCount;
          if (data.count) subs = data.count;
          if (data.est_subs) subs = data.est_subs;

          if (subs !== null && !isNaN(subs)) break;
        } catch (e) {
          console.log("API failed, trying next source...");
        }
      }

      // If all APIs fail → use weekly backup
      if (subs === null || isNaN(subs)) {
        subs = WEEKLY_BACKUP;
        console.log("Using weekly backup subscriber count:", subs);
      }
      

      updateProgress(subs);
    }

    function updateProgress(subs) {
      const nextGoal = goals.find(g => g > subs) || goals[goals.length - 1];
      const progressPercent = (subs / nextGoal) * 100;

      document.getElementById("progress-bar").style.width =
        progressPercent + "%";

      document.getElementById("sub-info").textContent =
        `Current Subscribers: ${subs} | Next goal: ${nextGoal} subs (${progressPercent.toFixed(1)}% there)`;
    }

    // Instant update every 5 seconds
    fetchSubsHybrid();
    setInterval(fetchSubsHybrid, 5000);
  </script>
    

</body>
</html>
